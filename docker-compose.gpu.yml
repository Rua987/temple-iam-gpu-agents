# 🎮 TEMPLE IAM GPU AGENTS - DOCKER COMPOSE 🏛️
# Déploiement complet des agents GPU gaming
# Compatible: Toutes RTX/GTX NVIDIA + Tous jeux AAA
# VERSION UNIVERSELLE : Détection automatique de N'IMPORTE QUEL JEU !
#
# PLUS ULTRA ! DATTEBAYO ! 🚀⚡

version: '3.8'

services:
  # 🖥️ Universal GPU Monitor - Surveillance GPU temps réel TOUS JEUX
  universal-gpu-monitor:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_universal_gpu_monitor
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MONITOR_INTERVAL=1.0
      - AUTO_LEARN=true
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/temple-iam/logs
      - ./results:/temple-iam/results
      - ./config:/temple-iam/config
      - ./learned_games.json:/temple-iam/learned_games.json
    command: python3 universal_gpu_monitor.py
    networks:
      - temple_gpu_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 🖥️ Legacy GPU Monitor - Alan Wake 2 spécifique (rétrocompatibilité)
  legacy-gpu-monitor:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_legacy_gpu_monitor
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GAME_NAME=AlanWake2
      - MONITOR_INTERVAL=1.0
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/temple-iam/logs
      - ./results:/temple-iam/results
      - ./config:/temple-iam/config
    command: python3 alan_wake2_gpu_monitor.py
    networks:
      - temple_gpu_network
    restart: unless-stopped
    profiles:
      - legacy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 🔥 Thermal Optimizer - Contrôle température & ventilateur
  thermal-optimizer:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_thermal_optimizer
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TARGET_TEMP=75
      - CRITICAL_TEMP=85
      - OPTIMIZATION_INTERVAL=2.0
    volumes:
      - ./logs:/temple-iam/logs
      - ./config:/temple-iam/config
    command: python3 temple_iam_thermal_optimizer.py
    networks:
      - temple_gpu_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ⚡ GPU Undervolt - Optimisation tension/fréquence
  gpu-undervolt:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_gpu_undervolt
    runtime: nvidia
    privileged: true  # Nécessaire pour undervolt
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - VOLTAGE_STEP=25
      - CLOCK_STEP=50
    volumes:
      - ./logs:/temple-iam/logs
      - ./results:/temple-iam/results
    command: python3 temple_iam_gpu_undervolt_quantum.py
    networks:
      - temple_gpu_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 🎮 Game Launcher + GPU Virtual - Lancement jeu optimisé
  game-launcher:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_game_launcher
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - GPU_VIRTUAL_ENABLED=true
      - TARGET_FPS=60
      - QUALITY_PRESET=Ultra
    volumes:
      - ./logs:/temple-iam/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    command: python3 temple_iam_alan_wake2_gpu_virtual_integration.py
    networks:
      - temple_gpu_network
    restart: "no"  # Pas de restart automatique pour le launcher
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, display]

  # 📊 RTX Optimizer - Optimisations spécifiques RTX
  rtx-optimizer:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: temple_iam_rtx_optimizer
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GPU_MODEL=auto  # Détection automatique
      - OPTIMIZATION_LEVEL=ultra
    volumes:
      - ./logs:/temple-iam/logs
      - ./config:/temple-iam/config
    command: python3 gpu_optimizer_ultra_v2.py
    networks:
      - temple_gpu_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 🌐 Web Dashboard - Interface web monitoring (optionnel)
  web-dashboard:
    image: nginx:alpine
    container_name: temple_iam_dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./logs:/usr/share/nginx/html/logs:ro
    networks:
      - temple_gpu_network
    restart: unless-stopped
    depends_on:
      - gpu-monitor
      - thermal-optimizer

networks:
  temple_gpu_network:
    driver: bridge
    name: temple_gpu_bridge

volumes:
  logs:
    driver: local
  results:
    driver: local
  config:
    driver: local
